services:
  - type: web
    name: iras-cloud
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: IRAS_PROVIDER
        value: openrouter
      - key: IRAS_MODEL
        value: openrouter/free
      - key: IRAS_ADAPTIVE_PERSONALITY
        value: "true"
      - key: IRAS_VOICE_PROFILE
        value: anime_soft
      - key: IRAS_CORS_ORIGINS
        value: "*"
      - key: IRAS_REMOTE_SESSION_MAX_PERMISSION_LEVEL
        value: "3"
      - key: IRAS_V5_SCHEDULER_ENABLED
        value: "true"
      - key: IRAS_V5_SCHEDULER_WORKERS
        value: "4"
      - key: IRAS_V5_MONITOR_POLL_SECONDS
        value: "15"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: IRAS_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: IRAS_VAULT_MASTER_KEY
        sync: false
