name: IRAS v4.3 RC2 project-aware engineering validation

on:
  push:
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate release
        shell: pwsh
        run: .\run-v430-validation.ps1
