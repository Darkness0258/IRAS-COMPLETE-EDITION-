name: IRAS v5.0 RC12 mega-integration validation

on:
  push:
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[all,cloud]"
      - name: Validate release
        shell: pwsh
        run: .\run-v500-validation.ps1
