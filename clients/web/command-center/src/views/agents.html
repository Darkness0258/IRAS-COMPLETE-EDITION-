      <section class="view agents" data-view="agents" id="view-agents" hidden aria-labelledby="agentsTitle">
        <header class="view-head">
          <div>
            <h1 class="title" id="agentsTitle">Agents</h1>
            <p>Start a task and watch every step. IRAS asks before anything risky.</p>
          </div>
          <button class="btn primary" id="newTask" type="button">{{i:plus sm}}<span>New task</span></button>
        </header>

        <div class="stats" id="agentStats"></div>

        <div class="agents-grid">
          <div class="agents-main">
            <div class="agent-tiles" id="agentTiles"></div>
            <h2 class="h3 sec-title">Runs</h2>
            <div class="runs" id="runList"></div>
          </div>
          <aside class="agents-side" aria-label="Routines">
          <div class="side-head" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px"><h2 class="h3">Routines</h2><span style="display:flex;gap:6px"><button type="button" class="btn sm" id="addReminder">{{i:clock sm}}<span>Remind me</span></button><button type="button" class="btn sm" id="addRoutine">{{i:plus sm}}<span>Add</span></button></span></div>
          <div class="routines" id="routineList"></div>
          <div class="side-head" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px"><h2 class="h3">Goals</h2><button type="button" class="btn sm" id="addGoal">{{i:plus sm}}<span>Add</span></button></div>
          <div class="routines" id="goalList"></div>
          <div class="side-head" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px"><h2 class="h3">Watching</h2><button type="button" class="btn sm" id="addMonitor">{{i:plus sm}}<span>Add</span></button></div>
          <div class="routines" id="monitorList"></div>
        <div class="side-head" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px"><h2 class="h3">Calendar</h2><button type="button" class="btn sm" id="addCalendar">{{i:plus sm}}<span>Add</span></button></div>
          <div class="routines" id="calendarList"></div>
        </aside>
        </div>
      </section>
