<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11131a">
  <title>IRAS</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <style>
    :root{font-family:Inter,Segoe UI,system-ui,sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;background:#0b0d12;color:#f5f7ff;min-height:100vh}
    .app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:16px}
    header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
    h1{margin:0;font-size:22px}.sub{opacity:.6;font-size:12px}
    #chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px 0 18px}
    .m{max-width:84%;padding:11px 13px;border-radius:16px;line-height:1.42;white-space:pre-wrap}
    .you{align-self:flex-end;background:#252a38}.iras{align-self:flex-start;background:#161a24;border:1px solid #292f40}
    .bar{position:sticky;bottom:0;background:#0b0d12;padding-top:8px;display:flex;gap:8px}
    input,button{border:1px solid #313749;background:#121621;color:#fff;border-radius:12px;padding:12px}
    #msg{flex:1;font-size:16px}button{cursor:pointer}
    .primary{background:#eef2ff;color:#0b0d12;font-weight:700}
    .active{border-color:#8fa5ff;background:#1e263e}
    dialog{background:#11151f;color:#fff;border:1px solid #353c50;border-radius:14px;max-width:520px;width:calc(100% - 24px)}
    dialog input{width:100%;margin:5px 0 12px}.row{display:flex;gap:8px;justify-content:flex-end}
    .status{font-size:12px;opacity:.65;margin-top:8px}
    .cursor::after{content:"";display:inline-block;width:6px;height:1em;margin-left:3px;vertical-align:-2px;background:#fff;opacity:.65;animation:blink .8s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>IRAS</h1><div class="sub">Online assistant · continuous voice</div></div>
    <button id="settings">Server</button>
  </header>

  <main id="chat"></main>

  <div class="bar">
    <button id="handsfree" title="Wake word: IRAS">Hands-free</button>
    <button id="mic" title="One-shot speech input">Mic</button>
    <input id="msg" placeholder="Talk to IRAS..." autocomplete="off">
    <button class="primary" id="send">Send</button>
  </div>
  <div class="status" id="status">Ready</div>
</div>

<dialog id="cfg">
  <h3>IRAS connection</h3>
  <label>Server URL</label>
  <input id="server" placeholder="https://iras-cloud.onrender.com">
  <label>IRAS access token</label>
  <input id="token" type="password" placeholder="Your IRAS_API_TOKEN">
  <label>Wake word</label>
  <input id="wake" placeholder="IRAS">
  <div class="row">
    <button id="cancelCfg">Cancel</button>
    <button class="primary" id="saveCfg">Save</button>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const chat=$("#chat"),msg=$("#msg"),status=$("#status");
const cfg=$("#cfg"),server=$("#server"),token=$("#token"),wake=$("#wake");
const handsButton=$("#handsfree");

let currentAudio=null,currentAudioUrl=null,currentChatAbort=null;
let voiceQueue=[],voicePumping=false,voiceSession=0,voiceBuffer="",lastSpokenText="";
let sending=false,chatGeneration=0;
let handsFree=false,recognition=null,restartTimer=null,manualRecognition=null;
let conversationUntil=0;

const local=JSON.parse(localStorage.getItem("iras-config")||"{}");
server.value=local.server||location.origin;
token.value=local.token||"";
wake.value=local.wakeWord||"IRAS";
handsFree=!!local.handsFree;

function add(who,text){
  const d=document.createElement("div");
  d.className="m "+(who==="You"?"you":"iras");
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}

function config(){return JSON.parse(localStorage.getItem("iras-config")||"{}")}

function saveConfig(){
  localStorage.setItem("iras-config",JSON.stringify({
    server:server.value.trim().replace(/\/$/,""),
    token:token.value.trim(),
    wakeWord:(wake.value.trim()||"IRAS"),
    handsFree
  }));
  cfg.close();
}

function wakeWord(){return (config().wakeWord||"IRAS").trim()}

function words(text){return (text.toLowerCase().match(/[a-z0-9']+/g)||[])}

function probableEcho(heard,spoken){
  const h=words(heard),s=words(spoken);
  if(!h.length||!s.length)return false;
  if(h.length===1&&h[0]===wakeWord().toLowerCase())return false;
  const hs=new Set(h),ss=new Set(s);
  let overlap=0;
  for(const word of hs)if(ss.has(word))overlap++;
  return overlap/Math.max(1,hs.size)>=0.68;
}

function parseWake(text){
  const raw=(text||"").trim();
  if(!raw)return {accepted:false,command:""};
  const w=wakeWord().replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const re=new RegExp("\\b(?:(?:hey|okay|ok)\\s+)?"+w+"\\b[\\s,.:;!?-]*(.*)$","i");
  const match=raw.match(re);
  if(match)return {accepted:true,command:(match[1]||"").trim()};
  if(Date.now()<conversationUntil)return {accepted:true,command:raw};
  return {accepted:false,command:""};
}

function stopCurrentAudio(){
  if(currentAudio){
    try{currentAudio.pause();currentAudio.currentTime=0}catch(_){}
    currentAudio=null;
  }
  if(currentAudioUrl){
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl=null;
  }
}

function resetVoice(){
  voiceSession++;
  voiceQueue=[];
  voiceBuffer="";
  voicePumping=false;
  stopCurrentAudio();
}

function interruptCurrentTurn(){
  chatGeneration++;
  if(currentChatAbort){
    try{currentChatAbort.abort()}catch(_){}
    currentChatAbort=null;
  }
  sending=false;
  $("#send").disabled=false;
  resetVoice();
}

async function fetchVoice(text,session){
  const c=config();
  const base=c.server||location.origin;

  const r=await fetch(base+"/v1/tts",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+c.token,
      "X-Device-ID":"web"
    },
    body:JSON.stringify({text})
  });

  if(!r.ok)throw new Error((await r.text())||("HTTP "+r.status));
  if(session!==voiceSession)return;

  const blob=await r.blob();
  if(session!==voiceSession)return;

  const url=URL.createObjectURL(blob);
  const audio=new Audio(url);
  currentAudio=audio;
  currentAudioUrl=url;
  lastSpokenText=text;

  await new Promise((resolve,reject)=>{
    audio.onended=resolve;
    audio.onerror=()=>reject(new Error("Voice playback failed"));
    audio.play().catch(reject);
  });

  if(currentAudio===audio)currentAudio=null;
  if(currentAudioUrl===url)currentAudioUrl=null;
  URL.revokeObjectURL(url);
}

async function pumpVoice(session){
  if(voicePumping||session!==voiceSession)return;
  voicePumping=true;

  try{
    while(voiceQueue.length&&session===voiceSession){
      const sentence=voiceQueue.shift();
      status.textContent="IRAS is speaking · say "+wakeWord()+" to interrupt";
      try{
        await fetchVoice(sentence,session);
      }catch(e){
        if(session===voiceSession)console.error("IRAS voice error:",e);
      }
    }
  }finally{
    if(session===voiceSession){
      voicePumping=false;
      if(!sending)status.textContent=handsFree?"Hands-free · say "+wakeWord():"Ready";
    }
  }
}

function enqueueVoice(text,session){
  const clean=(text||"").trim();
  if(!clean||session!==voiceSession)return;
  voiceQueue.push(clean);
  pumpVoice(session);
}

function drainVoiceBuffer(session,force=false){
  if(session!==voiceSession)return;

  while(true){
    const match=voiceBuffer.match(/^([\s\S]*?[.!?])(?=\s|$)/);
    if(!match)break;

    const sentence=match[1].trim();
    voiceBuffer=voiceBuffer.slice(match[0].length).trimStart();
    if(sentence)enqueueVoice(sentence,session);
  }

  if(force&&voiceBuffer.trim()){
    enqueueVoice(voiceBuffer.trim(),session);
    voiceBuffer="";
  }
}

function parseFrame(frame){
  let event="message";
  const data=[];

  for(const line of frame.split("\n")){
    if(line.startsWith("event:"))event=line.slice(6).trim();
    else if(line.startsWith("data:"))data.push(line.slice(5).trimStart());
  }

  if(!data.length)return null;
  try{return {event,data:JSON.parse(data.join("\n"))}}
  catch(_){return null}
}

async function legacyReply(base,c,text,bubble,session,signal){
  const r=await fetch(base+"/v1/chat",{
    method:"POST",
    signal,
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+c.token,
      "X-Device-ID":"web"
    },
    body:JSON.stringify({message:text,device_id:"web"})
  });

  if(!r.ok)throw new Error((await r.text())||("HTTP "+r.status));
  const data=await r.json();
  bubble.textContent=data.response;
  voiceBuffer=data.response;
  drainVoiceBuffer(session,true);
}

async function streamReply(base,c,text,bubble,session,signal){
  const r=await fetch(base+"/v1/chat/stream",{
    method:"POST",
    signal,
    headers:{
      "Content-Type":"application/json",
      "Accept":"text/event-stream",
      "Authorization":"Bearer "+c.token,
      "X-Device-ID":"web"
    },
    body:JSON.stringify({message:text,device_id:"web"})
  });

  if(r.status===404){
    await legacyReply(base,c,text,bubble,session,signal);
    return;
  }

  if(!r.ok)throw new Error((await r.text())||("HTTP "+r.status));
  if(!r.body)throw new Error("Streaming is unavailable in this browser.");

  const reader=r.body.getReader();
  const decoder=new TextDecoder();
  let buffer="",gotToken=false;

  while(true){
    const {value,done}=await reader.read();
    if(value)buffer+=decoder.decode(value,{stream:true});

    let split;
    while((split=buffer.indexOf("\n\n"))!==-1){
      const frame=buffer.slice(0,split);
      buffer=buffer.slice(split+2);
      const parsed=parseFrame(frame);
      if(!parsed)continue;

      const {event,data}=parsed;

      if(event==="start"){
        status.textContent=data.streaming?"IRAS is thinking...":"IRAS is working...";
      }else if(event==="token"){
        const chunk=data.text||"";
        if(!chunk)continue;

        if(!gotToken){
          gotToken=true;
          bubble.classList.add("cursor");
          status.textContent="IRAS is replying...";
        }

        bubble.textContent+=chunk;
        chat.scrollTop=chat.scrollHeight;

        voiceBuffer+=chunk;
        drainVoiceBuffer(session,false);
      }else if(event==="done"){
        bubble.classList.remove("cursor");
        drainVoiceBuffer(session,true);
        conversationUntil=Date.now()+20000;

        const first=data.first_token_ms||0,total=data.timing_ms||0;
        status.textContent=handsFree
          ?"Listening for your next sentence..."
          :(first>0
            ?`Reply started in ${(first/1000).toFixed(2)}s · total ${(total/1000).toFixed(2)}s`
            :`Completed in ${(total/1000).toFixed(2)}s`);
      }else if(event==="error"){
        bubble.classList.remove("cursor");
        throw new Error(data.message||"Streaming failed.");
      }
    }

    if(done)break;
  }
}

async function sendText(text,{interrupt=false}={}){
  text=(text||"").trim();
  if(!text)return;

  const c=config();
  if(!c.token){cfg.showModal();return}

  if(sending&&!interrupt)return;
  if(interrupt)interruptCurrentTurn();

  const generation=++chatGeneration;
  const session=++voiceSession;
  voiceQueue=[];
  voiceBuffer="";
  voicePumping=false;
  stopCurrentAudio();

  sending=true;
  $("#send").disabled=true;
  msg.value="";
  add("You",text);

  const bubble=add("IRAS","");
  status.textContent="IRAS is thinking...";

  const controller=new AbortController();
  currentChatAbort=controller;

  try{
    const base=c.server||location.origin;
    await streamReply(base,c,text,bubble,session,controller.signal);

    if(generation!==chatGeneration)return;

    if(!bubble.textContent.trim()){
      bubble.textContent="I lost that response. Try that again.";
    }
  }catch(e){
    if(generation!==chatGeneration||e.name==="AbortError")return;

    bubble.classList.remove("cursor");
    if(!bubble.textContent.trim())bubble.textContent="Connection error: "+e.message;
    else bubble.textContent+="\n\n[Connection interrupted]";
    status.textContent="AI provider unavailable";
  }finally{
    if(generation===chatGeneration){
      sending=false;
      $("#send").disabled=false;
      currentChatAbort=null;

      if(!voicePumping&&voiceQueue.length===0&&status.textContent!=="AI provider unavailable"){
        setTimeout(()=>{
          if(generation===chatGeneration&&!voicePumping&&!sending){
            status.textContent=handsFree?"Hands-free · say "+wakeWord():"Ready";
          }
        },1200);
      }
    }
  }
}

function send(){sendText(msg.value)}

function handleTranscript(transcript){
  const text=(transcript||"").trim();
  if(!text)return;

  if(probableEcho(text,lastSpokenText))return;

  const {accepted,command}=parseWake(text);
  if(!accepted){
    status.textContent="Hands-free · say "+wakeWord();
    return;
  }

  if(currentAudio||voicePumping||sending){
    interruptCurrentTurn();
  }

  if(!command){
    conversationUntil=Date.now()+8000;
    status.textContent="Yeah? I'm listening.";
    return;
  }

  conversationUntil=Date.now()+20000;
  sendText(command,{interrupt:true});
}

function recognitionCtor(){
  return window.SpeechRecognition||window.webkitSpeechRecognition;
}

function stopHandsRecognition(){
  if(restartTimer){clearTimeout(restartTimer);restartTimer=null}
  if(recognition){
    recognition.onend=null;
    try{recognition.stop()}catch(_){}
    recognition=null;
  }
}

function startHandsRecognition(){
  const SR=recognitionCtor();

  if(!SR){
    handsFree=false;
    updateHandsButton();
    status.textContent="Continuous speech recognition is not available in this browser.";
    return;
  }

  stopHandsRecognition();

  const r=new SR();
  recognition=r;
  r.lang="en-US";
  r.continuous=true;
  r.interimResults=true;

  r.onstart=()=>{
    status.textContent="Hands-free · say "+wakeWord();
  };

  r.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(!e.results[i].isFinal)continue;
      handleTranscript(e.results[i][0].transcript);
    }
  };

  r.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      handsFree=false;
      updateHandsButton();
      persistHandsFree();
      status.textContent="Microphone permission is required for hands-free mode.";
    }
  };

  r.onend=()=>{
    if(recognition===r)recognition=null;
    if(handsFree){
      restartTimer=setTimeout(()=>{
        if(handsFree)startHandsRecognition();
      },350);
    }
  };

  try{r.start()}
  catch(e){status.textContent="Hands-free could not start: "+e.message}
}

function persistHandsFree(){
  const c=config();

  localStorage.setItem("iras-config",JSON.stringify({
    ...c,
    server:c.server||server.value.trim().replace(/\/$/,""),
    token:c.token||token.value.trim(),
    wakeWord:wakeWord(),
    handsFree
  }));
}

function updateHandsButton(){
  handsButton.textContent=handsFree?"Hands-free On":"Hands-free Off";
  handsButton.classList.toggle("active",handsFree);
}

function toggleHandsFree(){
  handsFree=!handsFree;
  persistHandsFree();
  updateHandsButton();

  if(handsFree)startHandsRecognition();
  else{
    stopHandsRecognition();
    status.textContent="Hands-free off";
  }
}

$("#settings").onclick=()=>cfg.showModal();
$("#cancelCfg").onclick=()=>cfg.close();
$("#saveCfg").onclick=()=>{
  saveConfig();
  if(handsFree)startHandsRecognition();
};

$("#send").onclick=send;
msg.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
handsButton.onclick=toggleHandsFree;

$("#mic").onclick=()=>{
  if(handsFree){
    status.textContent="Hands-free is already listening.";
    return;
  }

  const SR=recognitionCtor();

  if(!SR){
    status.textContent="Speech recognition is not available in this browser.";
    return;
  }

  resetVoice();

  if(manualRecognition){
    try{manualRecognition.stop()}catch(_){}
  }

  const r=new SR();
  manualRecognition=r;
  r.lang="en-US";
  r.interimResults=false;

  r.onstart=()=>status.textContent="Listening...";
  r.onresult=e=>sendText(e.results[0][0].transcript,{interrupt:true});
  r.onerror=e=>status.textContent="Mic error: "+e.error;
  r.onend=()=>{if(manualRecognition===r)manualRecognition=null};

  r.start();
};

updateHandsButton();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/app/sw.js").catch(()=>{});
}

if(!localStorage.getItem("iras-config")){
  cfg.showModal();
}else if(handsFree){
  setTimeout(startHandsRecognition,600);
}
</script>
</body>
</html>
