<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11131a">
  <title>IRAS</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <style>
    :root{font-family:Inter,Segoe UI,system-ui,sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;background:#0b0d12;color:#f5f7ff;min-height:100vh}
    .app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:16px}
    header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
    h1{margin:0;font-size:22px}.sub{opacity:.6;font-size:12px}
    #chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px 0 18px}
    .m{max-width:84%;padding:11px 13px;border-radius:16px;line-height:1.42;white-space:pre-wrap}
    .you{align-self:flex-end;background:#252a38}.iras{align-self:flex-start;background:#161a24;border:1px solid #292f40}
    .bar{position:sticky;bottom:0;background:#0b0d12;padding-top:8px;display:flex;gap:8px}
    input,textarea,button{border:1px solid #313749;background:#121621;color:#fff;border-radius:12px;padding:12px}
    textarea{width:100%;min-height:110px;resize:vertical;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}
    pre{white-space:pre-wrap;word-break:break-word;background:#0a0c11;border:1px solid #292f40;border-radius:10px;padding:10px;max-height:40vh;overflow:auto}
    #msg{flex:1;font-size:16px}button{cursor:pointer}
    .primary{background:#eef2ff;color:#0b0d12;font-weight:700}
    .active{border-color:#8fa5ff;background:#1e263e}
    dialog{background:#11151f;color:#fff;border:1px solid #353c50;border-radius:14px;max-width:520px;width:calc(100% - 24px)}
    dialog input{width:100%;margin:5px 0 12px}.row{display:flex;gap:8px;justify-content:flex-end}
    .status{font-size:12px;opacity:.65;margin-top:8px}
    .cursor::after{content:"";display:inline-block;width:6px;height:1em;margin-left:3px;vertical-align:-2px;background:#fff;opacity:.65;animation:blink .8s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>IRAS</h1><div class="sub">Online assistant · continuous voice</div></div>
    <div style="display:flex;gap:8px"><button id="screen">Screen</button><button id="direct">Direct</button><button id="remote">Remote</button><button id="settings">Server</button></div>
  </header>

  <main id="chat"></main>

  <div class="bar">
    <button id="handsfree" title="Wake word: IRAS">Hands-free</button>
    <button id="mic" title="One-shot speech input">Mic</button>
    <input id="msg" placeholder="Talk to IRAS..." autocomplete="off">
    <button class="primary" id="send">Send</button>
  </div>
  <div class="status" id="status">Ready</div>
</div>

<dialog id="cfg">
  <h3>IRAS connection</h3>
  <label>Server URL</label>
  <input id="server" placeholder="https://iras-cloud.onrender.com">
  <label>IRAS access token</label>
  <input id="token" type="password" placeholder="Your IRAS_API_TOKEN">
  <label>Wake word</label>
  <input id="wake" placeholder="IRAS">
  <div class="row">
    <button id="cancelCfg">Cancel</button>
    <button class="primary" id="saveCfg">Save</button>
  </div>
</dialog>

<dialog id="screenDlg" style="max-width:96vw;width:1100px">
  <h3>Remote Windows screen</h3>
  <img id="screenImg" alt="Remote screen preview" style="display:block;max-width:100%;max-height:72vh;margin:auto;border-radius:8px">
  <div class="row" style="margin-top:10px"><button id="refreshScreen">Refresh</button><button id="closeScreen">Close</button></div>
</dialog>

<dialog id="directDlg">
  <h3>Direct remote action</h3>
  <div class="sub" style="margin-bottom:10px">Model-independent control. Every action is still limited by the active remote session and the laptop's local policy.</div>
  <label>Action</label>
  <input id="directAction" value="system_info" autocomplete="off">
  <label>Arguments (JSON object)</label>
  <textarea id="directArgs">{}</textarea>
  <pre id="directOut">Ready.</pre>
  <div class="row"><button id="closeDirect">Close</button><button class="primary" id="runDirect">Invoke</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const chat=$("#chat"),msg=$("#msg"),status=$("#status");
const cfg=$("#cfg"),server=$("#server"),token=$("#token"),wake=$("#wake");
const handsButton=$("#handsfree");
const remoteButton=$("#remote"),screenButton=$("#screen"),directButton=$("#direct");
const screenDlg=$("#screenDlg"),screenImg=$("#screenImg");
const directDlg=$("#directDlg"),directAction=$("#directAction"),directArgs=$("#directArgs"),directOut=$("#directOut");

let currentAudio=null,currentAudioUrl=null,currentChatAbort=null;
let voiceQueue=[],voicePumping=false,voiceSession=0,voiceBuffer="",lastSpokenText="";
let sending=false,chatGeneration=0;
let handsFree=false,recognition=null,restartTimer=null,manualRecognition=null;
let conversationUntil=0;
let recognitionHadAudio=false,recognitionHadSpeech=false;

const local=JSON.parse(localStorage.getItem("iras-config")||"{}");
server.value=local.server||location.origin;
token.value=sessionStorage.getItem("iras-api-token")||"";
wake.value=local.wakeWord||"IRAS";
handsFree=!!local.handsFree;

function add(who,text){
  const d=document.createElement("div");
  d.className="m "+(who==="You"?"you":"iras");
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}

function config(){
  const stored=JSON.parse(localStorage.getItem("iras-config")||"{}");
  return {...stored,token:sessionStorage.getItem("iras-api-token")||token.value.trim()};
}

function remoteSession(){
  try{return JSON.parse(sessionStorage.getItem("iras-remote-session")||"null")}catch(_){return null}
}

function setRemoteSession(value){
  if(value)sessionStorage.setItem("iras-remote-session",JSON.stringify(value));
  else sessionStorage.removeItem("iras-remote-session");
  updateRemoteButton();
}

function updateRemoteButton(){
  const s=remoteSession();
  remoteButton.textContent=s?"Remote: "+String(s.mode||"on").replace("_"," "):"Remote";
  remoteButton.classList.toggle("active",!!s);
}

function remoteHeaders(){
  const s=remoteSession();
  return s?{
    "X-IRAS-Remote-Session-ID":s.session_id,
    "X-IRAS-Remote-Token":s.session_token
  }:{};
}

async function createRemoteSession(){
  const c=config();
  if(!c.token){cfg.showModal();return}
  const base=c.server||location.origin;
  status.textContent="Connecting to your Windows PC...";
  const devicesResponse=await fetch(base+"/v1/devices",{headers:{"Authorization":"Bearer "+c.token}});
  if(!devicesResponse.ok)throw new Error((await devicesResponse.text())||("HTTP "+devicesResponse.status));
  const devices=(await devicesResponse.json()).devices||[];
  const device=devices.find(d=>d.online&&String(d.platform||"").toLowerCase().includes("windows"))||devices.find(d=>d.online);
  if(!device)throw new Error("No paired IRAS computer is online.");
  if(!confirm("Enable a 30-minute FULL remote-control session for "+device.display_name+"? The laptop's local policy is still the final permission boundary."))return;
  const response=await fetch(base+"/v1/remote/sessions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+c.token,"X-Device-ID":"web"},
    body:JSON.stringify({device_id:device.device_id,mode:"full",ttl_seconds:1800,scopes:["windows"]})
  });
  if(!response.ok)throw new Error((await response.text())||("HTTP "+response.status));
  const session=await response.json();
  setRemoteSession(session);
  status.textContent="Full remote session active for 30 minutes";
}

async function revokeRemoteSession(){
  const c=config(),s=remoteSession();
  if(!s){return}
  const base=c.server||location.origin;
  try{await fetch(base+"/v1/remote/sessions/"+encodeURIComponent(s.session_id),{method:"DELETE",headers:{"Authorization":"Bearer "+c.token}})}catch(_){}
  setRemoteSession(null);
  status.textContent="Remote session closed";
}

async function toggleRemote(){
  try{
    if(remoteSession())await revokeRemoteSession();
    else await createRemoteSession();
  }catch(e){status.textContent="Remote error: "+e.message}
}

async function invokeRemoteAction(action,args={},timeout=45){
  const c=config();
  if(!remoteSession())await createRemoteSession();
  const active=remoteSession();
  if(!active)throw new Error("Remote session was not created.");
  const base=c.server||location.origin;
  const response=await fetch(base+"/v1/remote/invoke",{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Device-ID":"web","X-IRAS-Remote-Token":active.session_token},
    body:JSON.stringify({session_id:active.session_id,action,arguments:args||{},timeout})
  });
  if(!response.ok)throw new Error((await response.text())||("HTTP "+response.status));
  const data=await response.json();
  return data.result;
}

async function refreshRemoteScreen(){
  status.textContent="Capturing remote screen...";
  const result=(await invokeRemoteAction("screen_preview",{max_width:1200,quality:62},45))||{};
  screenImg.src="data:"+(result.mime||"image/jpeg")+";base64,"+(result.base64||"");
  if(!screenDlg.open)screenDlg.showModal();
  status.textContent="Remote screen updated";
}

async function runDirectAction(){
  const action=directAction.value.trim();
  if(!action)throw new Error("Action is required.");
  let args={};
  const raw=directArgs.value.trim();
  if(raw){
    args=JSON.parse(raw);
    if(!args||Array.isArray(args)||typeof args!=="object")throw new Error("Arguments must be a JSON object.");
  }
  directOut.textContent="Running...";
  status.textContent="Running direct remote action...";
  const result=await invokeRemoteAction(action,args,60);
  directOut.textContent=JSON.stringify(result,null,2);
  status.textContent="Direct remote action completed";
}

function saveConfig(){
  const apiToken=token.value.trim();
  if(apiToken)sessionStorage.setItem("iras-api-token",apiToken);
  else sessionStorage.removeItem("iras-api-token");
  localStorage.setItem("iras-config",JSON.stringify({
    server:server.value.trim().replace(/\/$/,""),
    wakeWord:(wake.value.trim()||"IRAS"),
    handsFree
  }));
  cfg.close();
}

function wakeWord(){return (config().wakeWord||"IRAS").trim()}

function wakeAliases(){
  const primary=wakeWord().trim();
  if(primary.toLowerCase()!=="iras")return [primary];

  return [
    "IRAS",
    "Iris",
    "Eris",
    "Eras",
    "eye ris",
    "eye-ris",
    "eye ras",
    "eye-rass",
    "Ira's",
    "I R A S",
    "little girl",
    "cute"
  ];
}

function aliasRegex(alias){
  const parts=(alias.toLowerCase().match(/[a-z0-9']+/g)||[]);
  if(!parts.length)return alias.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return parts
    .map(part=>part.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))
    .join("[\\s-]*");
}

function wakeRegex(){
  return "(?:"+wakeAliases()
    .slice()
    .sort((a,b)=>b.length-a.length)
    .map(aliasRegex)
    .join("|")+")";
}

function words(text){return (text.toLowerCase().match(/[a-z0-9']+/g)||[])}

function parseWake(text,{ignoreConversation=false}={}){
  const raw=(text||"").trim();
  if(!raw)return {accepted:false,command:""};

  const re=new RegExp(
    "^\\s*(?:(?:hey|okay|ok)\\s+)?"
      +wakeRegex()
      +"\\b[\\s,.:;!?-]*(.*)$",
    "i"
  );

  const match=raw.match(re);

  if(match){
    return {
      accepted:true,
      command:(match[1]||"").trim()
    };
  }

  if(!ignoreConversation&&Date.now()<conversationUntil){
    return {accepted:true,command:raw};
  }

  return {accepted:false,command:""};
}

function isWakeOnlyPhrase(text){
  const parsed=parseWake(text,{ignoreConversation:true});
  return parsed.accepted&&!parsed.command;
}

function probableEcho(heard,spoken){
  const h=words(heard),s=words(spoken);
  if(!h.length||!s.length)return false;

  if(isWakeOnlyPhrase(heard))return false;

  const hs=new Set(h),ss=new Set(s);
  let overlap=0;
  for(const word of hs)if(ss.has(word))overlap++;
  return overlap/Math.max(1,hs.size)>=0.68;
}

function bestRecognitionTranscript(result){
  if(!result||!result.length)return "";

  for(let i=0;i<result.length;i++){
    const candidate=(result[i]&&result[i].transcript||"").trim();
    if(candidate&&parseWake(candidate).accepted)return candidate;
  }

  return (result[0]&&result[0].transcript||"").trim();
}

function stopCurrentAudio(){
  if(currentAudio){
    try{currentAudio.pause();currentAudio.currentTime=0}catch(_){}
    currentAudio=null;
  }
  if(currentAudioUrl){
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl=null;
  }
}

function resetVoice(){
  voiceSession++;
  voiceQueue=[];
  voiceBuffer="";
  voicePumping=false;
  stopCurrentAudio();
}

function interruptCurrentTurn(){
  chatGeneration++;
  if(currentChatAbort){
    try{currentChatAbort.abort()}catch(_){}
    currentChatAbort=null;
  }
  sending=false;
  $("#send").disabled=false;
  resetVoice();
}

async function fetchVoice(text,session){
  const c=config();
  const base=c.server||location.origin;

  const r=await fetch(base+"/v1/tts",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+c.token,
      "X-Device-ID":"web",
      ...remoteHeaders()
    },
    body:JSON.stringify({text})
  });

  if(!r.ok)throw new Error((await r.text())||("HTTP "+r.status));
  if(session!==voiceSession)return;

  const blob=await r.blob();
  if(session!==voiceSession)return;

  const url=URL.createObjectURL(blob);
  const audio=new Audio(url);
  currentAudio=audio;
  currentAudioUrl=url;
  lastSpokenText=text;

  await new Promise((resolve,reject)=>{
    audio.onended=resolve;
    audio.onerror=()=>reject(new Error("Voice playback failed"));
    audio.play().catch(reject);
  });

  if(currentAudio===audio)currentAudio=null;
  if(currentAudioUrl===url)currentAudioUrl=null;
  URL.revokeObjectURL(url);
}

async function pumpVoice(session){
  if(voicePumping||session!==voiceSession)return;
  voicePumping=true;

  try{
    while(voiceQueue.length&&session===voiceSession){
      const sentence=voiceQueue.shift();
      status.textContent="IRAS is speaking · say "+wakeWord()+" to interrupt";
      try{
        await fetchVoice(sentence,session);
      }catch(e){
        if(session===voiceSession)console.error("IRAS voice error:",e);
      }
    }
  }finally{
    if(session===voiceSession){
      voicePumping=false;
      if(!sending)status.textContent=handsFree?"Hands-free · say "+wakeWord():"Ready";
    }
  }
}

function enqueueVoice(text,session){
  const clean=(text||"").trim();
  if(!clean||session!==voiceSession)return;
  voiceQueue.push(clean);
  pumpVoice(session);
}

function drainVoiceBuffer(session,force=false){
  if(session!==voiceSession)return;

  while(true){
    const match=voiceBuffer.match(/^([\s\S]*?[.!?])(?=\s|$)/);
    if(!match)break;

    const sentence=match[1].trim();
    voiceBuffer=voiceBuffer.slice(match[0].length).trimStart();
    if(sentence)enqueueVoice(sentence,session);
  }

  if(force&&voiceBuffer.trim()){
    enqueueVoice(voiceBuffer.trim(),session);
    voiceBuffer="";
  }
}

function parseFrame(frame){
  let event="message";
  const data=[];

  for(const line of frame.split("\n")){
    if(line.startsWith("event:"))event=line.slice(6).trim();
    else if(line.startsWith("data:"))data.push(line.slice(5).trimStart());
  }

  if(!data.length)return null;
  try{return {event,data:JSON.parse(data.join("\n"))}}
  catch(_){return null}
}

async function legacyReply(base,c,text,bubble,session,signal){
  const r=await fetch(base+"/v1/chat",{
    method:"POST",
    signal,
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+c.token,
      "X-Device-ID":"web",
      ...remoteHeaders()
    },
    body:JSON.stringify({message:text,device_id:"web"})
  });

  if(!r.ok)throw new Error((await r.text())||("HTTP "+r.status));
  const data=await r.json();
  bubble.textContent=data.response;
  voiceBuffer=data.response;
  drainVoiceBuffer(session,true);
}

async function streamReply(base,c,text,bubble,session,signal){
  const r=await fetch(base+"/v1/chat/stream",{
    method:"POST",
    signal,
    headers:{
      "Content-Type":"application/json",
      "Accept":"text/event-stream",
      "Authorization":"Bearer "+c.token,
      "X-Device-ID":"web",
      ...remoteHeaders()
    },
    body:JSON.stringify({message:text,device_id:"web"})
  });

  if(r.status===404){
    await legacyReply(base,c,text,bubble,session,signal);
    return;
  }

  if(!r.ok)throw new Error((await r.text())||("HTTP "+r.status));
  if(!r.body)throw new Error("Streaming is unavailable in this browser.");

  const reader=r.body.getReader();
  const decoder=new TextDecoder();
  let buffer="",gotToken=false;

  while(true){
    const {value,done}=await reader.read();
    if(value)buffer+=decoder.decode(value,{stream:true});

    let split;
    while((split=buffer.indexOf("\n\n"))!==-1){
      const frame=buffer.slice(0,split);
      buffer=buffer.slice(split+2);
      const parsed=parseFrame(frame);
      if(!parsed)continue;

      const {event,data}=parsed;

      if(event==="start"){
        status.textContent=data.streaming?"IRAS is thinking...":"IRAS is working...";
      }else if(event==="queued"){
        const waited=data.waited_ms||0;
        status.textContent=waited>0
          ?`IRAS queued · waiting ${(waited/1000).toFixed(0)}s for the current task...`
          :"IRAS queued · waiting for the current task...";
      }else if(event==="token"){
        const chunk=data.text||"";
        if(!chunk)continue;

        if(!gotToken){
          gotToken=true;
          bubble.classList.add("cursor");
          status.textContent="IRAS is replying...";
        }

        bubble.textContent+=chunk;
        chat.scrollTop=chat.scrollHeight;

        voiceBuffer+=chunk;
        drainVoiceBuffer(session,false);
      }else if(event==="done"){
        bubble.classList.remove("cursor");
        drainVoiceBuffer(session,true);
        conversationUntil=Date.now()+20000;

        const first=data.first_token_ms||0,total=data.timing_ms||0;
        const queueWait=data.queue_wait_ms||0;
        status.textContent=handsFree
          ?"Listening for your next sentence..."
          :(first>0
            ?`Reply started in ${(first/1000).toFixed(2)}s · total ${(total/1000).toFixed(2)}s${queueWait>0?` · queued ${(queueWait/1000).toFixed(1)}s`:""}`
            :`Completed in ${(total/1000).toFixed(2)}s${queueWait>0?` · queued ${(queueWait/1000).toFixed(1)}s`:""}`);
      }else if(event==="error"){
        bubble.classList.remove("cursor");
        const err=new Error(data.message||"Streaming failed.");
        err.code=data.code||"request_failed";
        throw err;
      }
    }

    if(done)break;
  }
}

async function sendText(text,{interrupt=false}={}){
  text=(text||"").trim();
  if(!text)return;

  const c=config();
  if(!c.token){cfg.showModal();return}

  if(sending&&!interrupt)return;
  if(interrupt)interruptCurrentTurn();

  const generation=++chatGeneration;
  const session=++voiceSession;
  voiceQueue=[];
  voiceBuffer="";
  voicePumping=false;
  stopCurrentAudio();

  sending=true;
  $("#send").disabled=true;
  msg.value="";
  add("You",text);

  const bubble=add("IRAS","");
  status.textContent="IRAS is thinking...";

  const controller=new AbortController();
  currentChatAbort=controller;

  try{
    const base=c.server||location.origin;
    await streamReply(base,c,text,bubble,session,controller.signal);

    if(generation!==chatGeneration)return;

    if(!bubble.textContent.trim()){
      bubble.textContent="I lost that response. Try that again.";
    }
  }catch(e){
    if(generation!==chatGeneration||e.name==="AbortError")return;

    bubble.classList.remove("cursor");

    if(!bubble.textContent.trim()){
      bubble.textContent=e.code==="request_busy"
        ?e.message
        :"Connection error: "+e.message;
    }else{
      bubble.textContent+="\n\n[Connection interrupted]";
    }

    if(e.code==="request_busy"){
      status.textContent="IRAS busy · retry in a moment";
    }else if(e.code==="ai_rate_limited"){
      status.textContent="AI provider unavailable";
    }else{
      status.textContent="Connection error";
    }
  }finally{
    if(generation===chatGeneration){
      sending=false;
      $("#send").disabled=false;
      currentChatAbort=null;

      if(!voicePumping&&voiceQueue.length===0&&status.textContent!=="AI provider unavailable"){
        setTimeout(()=>{
          if(generation===chatGeneration&&!voicePumping&&!sending){
            status.textContent=handsFree?"Hands-free · say "+wakeWord():"Ready";
          }
        },1200);
      }
    }
  }
}

function send(){sendText(msg.value)}

function handleTranscript(transcript){
  const text=(transcript||"").trim();
  if(!text)return;

  if(probableEcho(text,lastSpokenText))return;

  const {accepted,command}=parseWake(text);
  if(!accepted){
    status.textContent="Hands-free · say "+wakeWord();
    return;
  }

  if(currentAudio||voicePumping||sending){
    interruptCurrentTurn();
  }

  if(!command){
    conversationUntil=Date.now()+8000;
    status.textContent="Yeah? I'm listening.";
    return;
  }

  conversationUntil=Date.now()+20000;
  sendText(command,{interrupt:true});
}

function recognitionCtor(){
  return window.SpeechRecognition||window.webkitSpeechRecognition;
}

async function ensureMicrophoneAccess(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    return true;
  }

  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });

    for(const track of stream.getTracks())track.stop();
    return true;
  }catch(e){
    const name=e&&e.name?e.name:"microphone error";
    status.textContent="Microphone unavailable: "+name+". Check Chrome site permissions.";
    return false;
  }
}

function stopHandsRecognition(){
  if(restartTimer){
    clearTimeout(restartTimer);
    restartTimer=null;
  }

  if(recognition){
    const old=recognition;
    recognition=null;
    old.onend=null;
    try{old.abort()}catch(_){
      try{old.stop()}catch(__){}
    }
  }
}

function scheduleHandsRestart(delay=250){
  if(!handsFree||document.hidden)return;

  if(restartTimer)clearTimeout(restartTimer);

  restartTimer=setTimeout(()=>{
    restartTimer=null;
    if(handsFree&&!document.hidden)startHandsRecognition();
  },delay);
}

async function startHandsRecognition(){
  if(!handsFree||document.hidden)return;

  const SR=recognitionCtor();

  if(!SR){
    handsFree=false;
    updateHandsButton();
    persistHandsFree();
    status.textContent="Chrome speech recognition is unavailable in this browser.";
    return;
  }

  stopHandsRecognition();

  recognitionHadAudio=false;
  recognitionHadSpeech=false;

  const r=new SR();
  recognition=r;
  r.lang="en-US";

  // Chrome's true continuous mode can stay open without finalizing short
  // wake-word utterances. One utterance per recognition session, followed by
  // automatic restart, is much more reliable while still remaining hands-free.
  r.continuous=false;
  r.interimResults=true;
  r.maxAlternatives=3;

  r.onstart=()=>{
    status.textContent="Hands-free · listening for "+wakeWord();
  };

  r.onaudiostart=()=>{
    recognitionHadAudio=true;
    status.textContent="Mic active · say "+wakeWord();
  };

  r.onspeechstart=()=>{
    recognitionHadSpeech=true;
    status.textContent="I hear you...";
  };

  r.onspeechend=()=>{
    status.textContent="Processing what I heard...";
  };

  r.onresult=e=>{
    let finalText="";
    let interimText="";

    for(let i=e.resultIndex;i<e.results.length;i++){
      const part=bestRecognitionTranscript(e.results[i]);
      if(!part)continue;

      if(e.results[i].isFinal){
        finalText+=(finalText?" ":"")+part;
      }else{
        interimText+=(interimText?" ":"")+part;
      }
    }

    const live=(finalText||interimText).trim();

    if(live){
      const short=live.length>55?live.slice(0,52)+"...":live;
      status.textContent='Heard: "'+short+'"';
    }

    // Arm immediately when the wake word appears in an interim result.
    // This fixes the common Chrome case where a single "IRAS" is heard but
    // takes too long to become a final result.
    if(interimText){
      const parsed=parseWake(interimText);
      if(parsed.accepted&&!parsed.command){
        conversationUntil=Date.now()+8000;
        status.textContent="Wake word heard · keep talking...";
      }
    }

    if(finalText){
      handleTranscript(finalText);
    }
  };

  r.onerror=e=>{
    const code=e.error||"unknown";

    if(code==="not-allowed"||code==="service-not-allowed"){
      handsFree=false;
      updateHandsButton();
      persistHandsFree();
      status.textContent="Microphone permission is blocked. Allow Mic for this site in Chrome.";
      return;
    }

    if(code==="audio-capture"){
      handsFree=false;
      updateHandsButton();
      persistHandsFree();
      status.textContent="Chrome cannot access a microphone. Check your Windows input device.";
      return;
    }

    if(code==="network"){
      status.textContent="Chrome speech service had a network error · retrying...";
      return;
    }

    if(code==="no-speech"){
      status.textContent=recognitionHadAudio
        ?"No speech detected · listening again..."
        :"Mic did not start · retrying...";
      return;
    }

    if(code!=="aborted"){
      status.textContent="Speech recognition error: "+code+" · retrying...";
    }
  };

  r.onend=()=>{
    if(recognition===r)recognition=null;

    if(handsFree&&!document.hidden){
      if(!recognitionHadAudio){
        status.textContent="Mic session ended before audio started · restarting...";
      }else if(!recognitionHadSpeech){
        status.textContent="Listening...";
      }

      scheduleHandsRestart(250);
    }
  };

  try{
    r.start();
  }catch(e){
    if(recognition===r)recognition=null;
    status.textContent="Hands-free start failed · retrying...";
    scheduleHandsRestart(600);
  }
}

function persistHandsFree(){
  const c=config();

  localStorage.setItem("iras-config",JSON.stringify({
    server:c.server||server.value.trim().replace(/\/$/,""),
    wakeWord:wakeWord(),
    handsFree
  }));
}

function updateHandsButton(){
  handsButton.textContent=handsFree?"Hands-free On":"Hands-free Off";
  handsButton.classList.toggle("active",handsFree);
}

async function toggleHandsFree(){
  if(!handsFree){
    const allowed=await ensureMicrophoneAccess();

    if(!allowed){
      handsFree=false;
      persistHandsFree();
      updateHandsButton();
      return;
    }

    handsFree=true;
    persistHandsFree();
    updateHandsButton();
    startHandsRecognition();
    return;
  }

  handsFree=false;
  persistHandsFree();
  updateHandsButton();
  stopHandsRecognition();
  status.textContent="Hands-free off";
}

$("#settings").onclick=()=>cfg.showModal();
remoteButton.onclick=toggleRemote;
screenButton.onclick=()=>refreshRemoteScreen().catch(e=>status.textContent="Screen error: "+e.message);
directButton.onclick=()=>directDlg.showModal();
$("#runDirect").onclick=()=>runDirectAction().catch(e=>{directOut.textContent="Error: "+e.message;status.textContent="Direct remote error"});
$("#closeDirect").onclick=()=>directDlg.close();
$("#refreshScreen").onclick=()=>refreshRemoteScreen().catch(e=>status.textContent="Screen error: "+e.message);
$("#closeScreen").onclick=()=>screenDlg.close();
updateRemoteButton();
$("#cancelCfg").onclick=()=>cfg.close();
$("#saveCfg").onclick=()=>{
  saveConfig();
  if(handsFree)startHandsRecognition();
};

$("#send").onclick=send;
msg.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
handsButton.onclick=toggleHandsFree;

$("#mic").onclick=async()=>{
  if(handsFree){
    status.textContent="Hands-free is already listening.";
    return;
  }

  if(!(await ensureMicrophoneAccess()))return;

  const SR=recognitionCtor();

  if(!SR){
    status.textContent="Speech recognition is not available in this browser.";
    return;
  }

  resetVoice();

  if(manualRecognition){
    try{manualRecognition.abort()}catch(_){}
  }

  const r=new SR();
  manualRecognition=r;
  r.lang="en-US";
  r.continuous=false;
  r.interimResults=true;

  r.onstart=()=>status.textContent="Listening...";
  r.onaudiostart=()=>status.textContent="Mic active · speak now";
  r.onspeechstart=()=>status.textContent="I hear you...";
  r.onresult=e=>{
    let finalText="";
    for(let i=0;i<e.results.length;i++){
      if(e.results[i].isFinal){
        finalText+=(finalText?" ":"")+e.results[i][0].transcript;
      }
    }
    if(finalText.trim())sendText(finalText.trim(),{interrupt:true});
  };
  r.onerror=e=>status.textContent="Mic error: "+e.error;
  r.onend=()=>{
    if(manualRecognition===r)manualRecognition=null;
    if(!sending)status.textContent="Ready";
  };

  r.start();
};

updateHandsButton();

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    stopHandsRecognition();
  }else if(handsFree){
    scheduleHandsRestart(150);
  }
});

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/app/sw.js").catch(()=>{});
}

if(!localStorage.getItem("iras-config")){
  cfg.showModal();
}else if(handsFree){
  setTimeout(async()=>{
    const allowed=await ensureMicrophoneAccess();
    if(allowed)startHandsRecognition();
    else{
      handsFree=false;
      persistHandsFree();
      updateHandsButton();
    }
  },600);
}
</script>
</body>
</html>
